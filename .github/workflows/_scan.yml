name: _scan

on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: scan-${{ inputs.source }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan ${{ inputs.source }}
        run: python run.py --source ${{ inputs.source }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
