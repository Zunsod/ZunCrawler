name: daily-worki-lambda

on:
  schedule:
    - cron: "0 7 * * *" # УБ 15:00
  workflow_dispatch:

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        source: [worki, lambda]
    uses: ./.github/workflows/_scan.yml
    with:
      source: ${{ matrix.source }}
    secrets: inherit
